version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
      # Advisories should not wait for the monthly window.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: monthly
    groups:
      pip:
        patterns: ["*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
