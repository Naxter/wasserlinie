[project]
name = "wasserlinie-pipeline"
version = "0.1.0"
description = "Fetches German gauge readings and prepares the static data assets for Wasserlinie."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyproj>=3.6",
  "pyshp>=2.3",
  "scikit-learn>=1.5",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff~=0.16.3"]

[project.scripts]
wasserlinie = "wasserlinie.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wasserlinie*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
